name: PROJECT-NAS Runtime Smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"
  PROJECT_NAS_DOCTOR_OFFLINE: "1"

jobs:
  runtime-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create isolated Python environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -r requirements-test.txt
          .ci-venv/bin/python -m pip install -r requirements-runtime.txt

      - name: Check shell syntax
        run: bash -n runtime/project-nas.sh

      - name: Run runtime controller regression suite
        run: .ci-venv/bin/python -m pytest -q tests/test_runtime_controller.py

      - name: Exercise no-service controller path
        env:
          PROJECT_NAS_TEST_PID_DIR: ${{ runner.temp }}/project-nas-pids
          PROJECT_NAS_BACKEND_HEALTH_URL: http://127.0.0.1:1/health
          PROJECT_NAS_MEMORY_HEALTH_URL: http://127.0.0.1:1/health
          PROJECT_NAS_OLLAMA_BASE_URL: http://127.0.0.1:1
        run: |
          runtime/project-nas.sh stop
          ! grep -R . "$PROJECT_NAS_TEST_PID_DIR" 2>/dev/null || true
